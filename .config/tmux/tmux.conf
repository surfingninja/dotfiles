# Remember that tmux is heavily aliased
# bind == bind-key
# set  == set-option
# setw == set-window-option
set -g default-shell /bin/zsh
#set -g mouse on

#set -ga terminal-overrides ",xterm-256color:Tc"
#set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
#set -as terminal-overrides ",*:Tc"
set -as terminal-features ",*:RGB"
# Faster prefixing
set-option -g prefix M-a
bind C-@ last-window
#unbind C-b

# send prefix to inner session
bind a send-prefix

# First window should be 1 (easier acces on number row)
set -g base-index 1
setw -g pane-base-index 1
set -g pane-border-status top
set -g pane-border-format " [ ###P #T ] "
set -g pane-border-lines double
set -g renumber-windows on

# A little more history (default is 2000)
set -g history-limit 5000

# Faster repetition
set -sg escape-time 0

# A little help to the annoying window resizes
setw -g aggressive-resize on

# Notifications
setw -g monitor-activity on
set -g visual-activity off

# vim bindings for copy/paste
setw -g mode-keys vi
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-forward '%%%'"

# vim stuff for vi mode, copy and pasting
# bind vi-copy 'v' begin-selection
# bind vi-copy 'y' copy-selection
# bind vi-copy 'Y' copy-end-of-line
unbind ]
bind p paste-buffer
bind y run -b "~/.config/tmux/copy-buf.sh"

# vim movements for pane switching
unbind j
unbind k
unbind h
unbind l
# these movements had -r before, which causes a slight delay,
# when going only one step, therefore scratched
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# new panes and windows - newer tmux version need us to declare
# the starting directory manually
bind '\' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# additional window movements, just like tab movement in vim
bind -r C-L next-window
bind -r C-H previous-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-r command-prompt -p "New pane name: " "select-pane -T %1"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-Enter new-window
bind -n M-c kill-pane
bind -n M-q kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

# Display popups
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-g display-popup -E "bash -i ~/.tmux/scripts/chat-popup.sh"
bind C-z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.zshrc'
bind C-r display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "ranger"

# Status bar and general style
set -g status-position top
#set -g status-bg default # same as terminal bg
#set -g status-fg white
#set -g status-interval 60 # leave the default 15
set -g status-left-length 100
set -g status-style "fg=#d8dee9, bg=default"
set -g status-left '#[fg=#a3be8c,bold] #S #[fg=#d8dee9,nobold] | #[fg=chartreuse3]#I:#P #[fg=gold3]#H'
set -g status-justify centre
set -g status-right '#(~/.config/tmux/sysstats.sh) #[fg=grey54] Time: #[default]#(date +%H:%M)' 
set -g status-right-length 100
set -g window-status-current-format "#[fg=darkcyan,bold] #[underscore]#I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=grey54,bg=default"
set -g mode-style "fg=grey42,bg=steelblue"
set -g pane-border-style "fg=grey42"
set -g pane-active-border-style "fg=chartreuse3"
# Time status line messages get shown
set -g display-time 1250

# Toggle mouse on and off
bind m if-shell "tmux show -gqv mouse | grep -q off" \
  "set -g mouse on; display 'Mouse enabled'" \
  "set -g mouse off; display 'Mouse disabled'"

# reload the source
bind r source-file ~/.config/tmux/tmux.conf\; display 'Tmux configuration reloaded'

# kill pane without confirmation prompt
bind Q kill-pane

# open a little debug pane on the bottom
bind b split-window -v -p 20 -c '#{pane_current_path}'


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if-shell '[ "$(uname)" = "Darwin" ]' \
  "set -g @tpm_path '/opt/homebrew/opt/tpm/share/tpm/tpm'" \
  "set -g @tpm_path '~/.config/tmux/plugins/tpm'"

#mkdir -p ~/.config/tmux/plugins && git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
